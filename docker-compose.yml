name: reservas-core-infra

services:
  # -------------------------------------------------------------
  # CAPA DE PERSISTENCIA: PostgreSQL (aislado del entorno de dev)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: reservas_infra_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - reservas_pg_data:/var/lib/postgresql/data
    healthcheck:
      # Evita que la API intente migrar antes de que el motor acepte conexiones
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # CAPA DE APLICACIÓN: Backend API REST (Node.js + Prisma)
  # -------------------------------------------------------------
  backend:
    build:
      context: ../reservas-core-app
      dockerfile: Dockerfile
    container_name: reservas_infra_api
    restart: unless-stopped
    environment:
      # Resolución interna por nombre de servicio dentro de la red del compose
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PORT: 3001
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
    ports:
      - "${BACKEND_PORT}:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------
  # CAPA DE PRESENTACIÓN: Frontend SPA (React + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ../reservas-core-front
      dockerfile: Dockerfile
      args:
        # El navegador consume el backend desde el host; incluye el prefijo /api
        VITE_API_URL: http://localhost:${BACKEND_PORT}/api
    container_name: reservas_infra_web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  reservas_pg_data:
